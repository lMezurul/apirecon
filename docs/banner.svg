<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08080A"/>
      <stop offset="0.6" stop-color="#0D090B"/>
      <stop offset="1" stop-color="#140A0C"/>
    </linearGradient>
    <linearGradient id="title" x1="300" y1="100" x2="640" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#FFC9C9"/>
      <stop offset="1" stop-color="#FF5C5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 160) rotate(90) scale(190 300)">
      <stop offset="0" stop-color="#E5484D" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#E5484D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FF5C5C" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="19.25" stroke="#2A1416" stroke-width="1.5"/>

  <!-- radar -->
  <g transform="translate(96 150)" stroke="#E5484D" fill="none">
