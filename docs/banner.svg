    <g font-family="Cascadia Code, Consolas, monospace" font-size="10">
      <rect x="16" y="50" width="34" height="16" rx="4" fill="#0F2417" stroke="#1F4A2A"/>
      <text x="33" y="61" text-anchor="middle" fill="#9BE9A8">GET</text>
