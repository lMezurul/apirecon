    <circle cx="34" cy="-30" r="3.5" fill="#FF5C5C" stroke="none"/>
    <circle cx="-20" cy="28" r="3" fill="#FF8080" stroke="none"/>
    <circle cx="10" cy="-8" r="2.5" fill="#FFB4B4" stroke="none"/>
  </g>

  <text x="200" y="152" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#title)">API Recon</text>
  <text x="204" y="190" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="19" fill="#A1A1AA">See the API behind the page.</text>

